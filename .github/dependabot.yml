version: 2
updates:

  # Frontend – npm
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      angular:
        patterns:
          - "@angular/*"
    ignore:
      # TypeScript 6 nécessite @angular/build >= 22 (encore en RC).
      # À retirer quand Angular 22 stable sera adopté.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Backend – binance-ingester (Maven)
  - package-ecosystem: "maven"
    directory: "/backend/binance-ingester"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"

  # Backend – trading-simulator (Maven)
  - package-ecosystem: "maven"
    directory: "/backend/trading-simulator"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"

  # Docker (docker-compose)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
