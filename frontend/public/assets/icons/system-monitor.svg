  <!-- Data points on orange line -->
  <circle cx="12" cy="42" r="2.5" fill="#E95420"/>
  <circle cx="20" cy="38" r="2.5" fill="#E95420"/>
  <circle cx="28" cy="34" r="2.5" fill="#E95420"/>
  <circle cx="36" cy="28" r="2.5" fill="#E95420"/>
  <circle cx="44" cy="24" r="2.5" fill="#E95420"/>

  <!-- Data points on green line -->
  <circle cx="12" cy="32" r="2.5" fill="#77DD77"/>
  <circle cx="20" cy="30" r="2.5" fill="#77DD77"/>
  <circle cx="28" cy="28" r="2.5" fill="#77DD77"/>
  <circle cx="36" cy="30" r="2.5" fill="#77DD77"/>
  <circle cx="44" cy="32" r="2.5" fill="#77DD77"/>
  <circle cx="52" cy="30" r="2.5" fill="#77DD77"/>
</svg>
