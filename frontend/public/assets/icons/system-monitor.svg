<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark aubergine background -->
  <rect width="64" height="64" rx="8" fill="#2C001E"/>

  <!-- Orange line chart (ascending) -->
  <path d="M12 42 L20 38 L28 34 L36 28 L44 24" stroke="#E95420" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Green line chart (stable/fluctuating) -->
