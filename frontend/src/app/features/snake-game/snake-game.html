<div class="snake-game-container">
  <div class="game-header">
    <div class="score">Score: <span class="score-value">{{ score }}</span></div>
    @if (highScore > 0) {
      <div class="high-score">Best: <span class="high-score-value">{{ highScore }}</span></div>
    }
  </div>

  <div class="canvas-wrapper">
    <canvas #gameCanvas></canvas>

    @if (state === 'start') {
      <div class="start-overlay">
        <div class="overlay-content">
          <h2>Snake</h2>
          <p class="controls-hint">Use Arrow Keys to move</p>
          <p class="start-hint">Press SPACE to start</p>
        </div>
      </div>
    }
  </div>
</div>
