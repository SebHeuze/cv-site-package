<div class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2>GAME OVER</h2>
      <button class="close-btn" (click)="onClose()">×</button>
    </div>

    <div class="modal-body">
      <div class="game-stats">
        <div class="stat-item">
          <span class="stat-label">Survival Time:</span>
          <span class="stat-value highlight">{{ formatTime(survivalTime) }}</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Final Capital:</span>
          <span class="stat-value">{{ finalCapital.toFixed(2) }} USDT</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Trades Executed:</span>
          <span class="stat-value">{{ tradeCount }}</span>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-primary" (click)="onPlayAgain()">
          Play Again
        </button>
      </div>
    </div>
  </div>
</div>
