<div
  #windowElement
  class="window"
  [style.z-index]="window.zIndex"
  [style.transform]="getTransform()"
  [class.maximized]="window.isMaximized"
  [class.trading-game-window]="window.component === 'trading-game'"
  (mousedown)="onWindowMouseDown()">

  <!-- Window Title Bar -->
  <div #titleBar class="window-header" (dblclick)="onMaximize()">
    <div class="window-spacer"></div>
    <div class="window-title">{{ window.title }}</div>
    <div class="window-controls">
      <!-- Minimize Button (Ubuntu order: minimize, maximize, close) -->
      <button class="control-btn minimize-btn" (click)="onMinimize(); $event.stopPropagation()" title="Minimize">
        <svg width="10" height="2" viewBox="0 0 10 2" fill="none">
          <rect width="10" height="2" rx="1" fill="white"/>
        </svg>
      </button>
      <!-- Maximize Button -->
      <button class="control-btn maximize-btn" (click)="onMaximize(); $event.stopPropagation()" title="Maximize">
        <svg width="8" height="8" viewBox="0 0 10 10" fill="none">
          <rect width="10" height="10" stroke="white" stroke-width="1.5"/>
        </svg>
      </button>
      <!-- Close Button -->
      <button class="control-btn close-btn" (click)="onClose(); $event.stopPropagation()" title="Close">
        <svg width="8" height="8" viewBox="0 0 8 8" fill="none">
          <path d="M1 1L7 7M7 1L1 7" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Window Content -->
  <div class="window-content">
    @switch (window.component) {
      @case ('cv-terminal') {
        <app-cv-terminal></app-cv-terminal>
      }
      @case ('trading-game') {
        <app-trading-game></app-trading-game>
      }
      @case ('cv-viewer') {
        <app-cv-viewer></app-cv-viewer>
      }
      @case ('snake-game') {
        <app-snake-game></app-snake-game>
      }
      @case ('system-monitor') {
        <app-system-monitor></app-system-monitor>
      }
      @default {
        <div>
          <p>Unknown component: {{ window.component }}</p>
        </div>
      }
    }
  </div>

  <!-- Resize Handles (only show when not maximized) -->
  @if (!window.isMaximized) {
    <div class="resize-handles">
      <div class="resize-handle resize-n" (mousedown)="onResizeStart($event, 'n')"></div>
      <div class="resize-handle resize-e" (mousedown)="onResizeStart($event, 'e')"></div>
      <div class="resize-handle resize-s" (mousedown)="onResizeStart($event, 's')"></div>
      <div class="resize-handle resize-w" (mousedown)="onResizeStart($event, 'w')"></div>
      <div class="resize-handle resize-ne" (mousedown)="onResizeStart($event, 'ne')"></div>
      <div class="resize-handle resize-se" (mousedown)="onResizeStart($event, 'se')"></div>
      <div class="resize-handle resize-sw" (mousedown)="onResizeStart($event, 'sw')"></div>
      <div class="resize-handle resize-nw" (mousedown)="onResizeStart($event, 'nw')"></div>
    </div>
  }
</div>
